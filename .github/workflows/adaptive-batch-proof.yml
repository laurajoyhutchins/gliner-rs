name: Adaptive boundary batch performance proof
on:
  pull_request:
    paths:
      - 'src/**'
      - 'examples/bench_adaptive_policy.rs'
      - 'benchmarks/check_adaptive_batch_outputs.py'
      - '.github/workflows/adaptive-batch-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-output-batch-ab:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: laurajoyhutchins/gliner-rs
          ref: aabfa5fa3a60cff37a1faa4bd7bbf0c5237a7ec8
          path: previous-master
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Use exactly the same benchmark source on both revisions
        run: |
          cp examples/bench_adaptive_policy.rs previous-master/examples/bench_adaptive_policy.rs
          python -m py_compile benchmarks/check_adaptive_batch_outputs.py
      - name: Compile each revision's runtime and identical harness
        run: |
          cargo build --release --locked --example bench_adaptive_policy
          cargo build --release --locked --manifest-path previous-master/Cargo.toml --example bench_adaptive_policy
      - name: Acquire immutable verified model
        run: |
          python -m pip install huggingface_hub==1.33.0
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='fastino/gliner2.5-small-v1',
              revision='df5910e44bc4ffdb0d95399a83b0ca4516349aa5',
              local_dir='checkpoint',
              allow_patterns=['config.json', 'encoder_config/config.json', 'tokenizer.json', 'model.safetensors'],
          )
          PY
          printf '%s  %s\n' '4ee982787ace270d4bf15dbcb28ced38e0aa201372347114ceedd6336055de2b' checkpoint/model.safetensors | sha256sum --check
      - name: Alternating full-model batch run A
        run: |
          RAYON_NUM_THREADS=2 OMP_NUM_THREADS=2 previous-master/target/release/examples/bench_adaptive_policy checkpoint | tee baseline-batch.jsonl
      - name: Alternating full-model batch run B
        run: |
          RAYON_NUM_THREADS=2 OMP_NUM_THREADS=2 target/release/examples/bench_adaptive_policy checkpoint | tee candidate-batch.jsonl
      - name: Fail if any complete result differs and report whole-model timings
        run: |
          python benchmarks/check_adaptive_batch_outputs.py baseline-batch.jsonl candidate-batch.jsonl | tee adaptive-proof.txt
      - name: Save auditable run-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-adaptive-batch-evidence
          path: |
            baseline-batch.jsonl
            candidate-batch.jsonl
            adaptive-proof.txt
          if-no-files-found: warn
          retention-days: 7
