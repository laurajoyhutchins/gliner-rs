# Temporary, branch-constrained bootstrapping of the browser test lockfile.
# Removed before merge. Never runs for fork pull requests.
name: Bootstrap browser harness lockfile

on:
  push:
    branches:
      - automation/browser-wasm-smoke
    paths:
      - 'website/browser-tests/package.json'
      - '.github/workflows/browser-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'laurajoyhutchins/gliner-rs'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact Playwright release and commit npm lockfile
        working-directory: website/browser-tests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock only
        run: |
          git add -- website/browser-tests/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: lock pinned Playwright runtime dependencies"
          git push origin HEAD:automation/browser-wasm-smoke
