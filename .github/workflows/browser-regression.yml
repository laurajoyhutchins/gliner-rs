name: Browser checkpoint regression

on:
  pull_request:
    paths:
      - 'src/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'website/**'
      - 'contracts/checkpoint-lock.schema.json'
      - 'tests/contracts/**'
      - '.github/workflows/browser-regression.yml'
      - '.github/workflows/wasm-regenerate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-browser-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-pack
        run: cargo install --locked wasm-pack --version "$(cat website/wasm-pack-version)"
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install website dependencies from lockfile
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Reject stale committed WebAssembly against Rust source
        working-directory: website
        run: pnpm build:wasm:check
      - name: Run browser model lifecycle and artifact drift regressions
        working-directory: website
        run: pnpm test
      - name: Typecheck website code
        working-directory: website
        run: pnpm check
      - name: Build deployable browser site
        working-directory: website
        run: pnpm build
      - name: Install checkpoint schema validator
        run: python3 -m pip install --user jsonschema==4.26.0
      - name: Check browser manifest against the shared JSON Schema
        run: python3 -m unittest discover -s tests/contracts -p 'test_*.py' -v
