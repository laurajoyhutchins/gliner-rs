name: Verified Docling model assets (on demand)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: layout-ocr
            files: "layout_heron.onnx ocr_rec.onnx ppocr_keys_v1.txt ocr_rec_en.onnx en_dict.txt ocr_det.onnx ocr_rec_v6.onnx ocr_rec_v6_dict.txt"
          - part: tableformer
            files: "encoder.onnx decoder.onnx decoder.onnx.data bbox.onnx bbox.onnx.data"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify exact approved Docling model weights
        shell: bash
        env:
          FILES: ${{ matrix.files }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          BASE='https://github.com/docling-project/docling.rs/releases/download/models-v1'
          mkdir -p .models/tableformer
          for name in $FILES; do
            expected="$(awk -v n="$name" '$2 == n { print $1; exit }' benchmarks/regulatory/docling-models.sha256)"
            [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || { echo "Missing locked SHA: $name"; exit 1; }
            target=".models/$name"
            [[ "$PART" == tableformer ]] && target=".models/tableformer/$name"
            curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 \
              --silent --show-error "$BASE/$name" -o "$target"
            observed="$(sha256sum "$target" | cut -d' ' -f1)"
            [[ "$expected" == "$observed" ]] || { echo "SHA mismatch: $name"; exit 1; }
            printf '%s  %s\n' "$observed" "$name" >> "verified-$PART.txt"
          done
          tar -czf "docling-models-$PART.tar.gz" .models
          sha256sum "docling-models-$PART.tar.gz" > "archive-$PART.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: docling-models-${{ matrix.part }}
          path: |
            docling-models-${{ matrix.part }}.tar.gz
            archive-${{ matrix.part }}.sha256
            verified-${{ matrix.part }}.txt
          if-no-files-found: error
          retention-days: 1
