name: Shared prompt HTTP batch A/B proof
on:
  pull_request:
    paths:
      - 'src/model.rs'
      - 'src/processor.rs'
      - 'benchmarks/http_batch_ab.py'
      - '.github/workflows/http-batch-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-model-http-ab:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: laurajoyhutchins/gliner-rs
          ref: 705c8577aa38019c04a4979974639248b90c36e3
          path: baseline-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile unchanged reference and candidate HTTP servers
        run: |
          cargo build --release --locked --bin gliner
          mkdir -p candidate
          cp target/release/gliner candidate/gliner
          cargo build --release --locked --manifest-path baseline-source/Cargo.toml --bin gliner
          mkdir -p baseline
          cp baseline-source/target/release/gliner baseline/gliner
      - name: Download and verify original pinned GLiNER checkpoint
        run: |
          python -m pip install huggingface_hub==1.33.0
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='fastino/gliner2.5-small-v1',
              revision='df5910e44bc4ffdb0d95399a83b0ca4516349aa5',
              local_dir='checkpoint',
              allow_patterns=['config.json', 'encoder_config/config.json', 'tokenizer.json', 'model.safetensors'],
          )
          PY
          printf '%s  %s\n' '4ee982787ace270d4bf15dbcb28ced38e0aa201372347114ceedd6336055de2b' checkpoint/model.safetensors | sha256sum --check
      - name: AB/BA HTTP batch against independent serial outputs
        run: |
          python benchmarks/http_batch_ab.py \
            --baseline baseline/gliner --candidate candidate/gliner \
            --model-dir checkpoint \
            --checkpoint-sha256 4ee982787ace270d4bf15dbcb28ced38e0aa201372347114ceedd6336055de2b \
            --threads 2 --pairs 2 --samples 3 --warmups 1 \
            --out http-batch-ab.json
      - name: Retain output-bound experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-schema-preparation-ab
          path: |
            http-batch-ab.json
            http-batch-ab.*.log
          if-no-files-found: warn
          retention-days: 7
