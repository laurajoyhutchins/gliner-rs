name: Pinned whole-model stage profile
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/profile_stages.py'
      - 'benchmarks/test_profile_stages.py'
      - '.github/workflows/inference-stage-profile.yml'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run parser regression
        run: python -m unittest discover -s benchmarks -p 'test_profile_stages.py' -v
      - name: Compile current exact-head inference
        run: cargo build --release --locked --bin gliner
      - name: Install pinned checkpoint transport
        run: python -m pip install huggingface_hub==1.33.0
      - name: Retrieve immutable small checkpoint
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='fastino/gliner2.5-small-v1',
              revision='df5910e44bc4ffdb0d95399a83b0ca4516349aa5',
              local_dir='checkpoint',
              allow_patterns=['config.json', 'encoder_config/config.json', 'tokenizer.json', 'model.safetensors'],
          )
          PY
          printf '%s  %s\n' '4ee982787ace270d4bf15dbcb28ced38e0aa201372347114ceedd6336055de2b' checkpoint/model.safetensors | sha256sum --check
      - name: Profile pinned regular inference workloads
        run: |
          python benchmarks/profile_stages.py \
            --rust-bin target/release/gliner \
            --model-dir checkpoint \
            --checkpoint-sha256 4ee982787ace270d4bf15dbcb28ced38e0aa201372347114ceedd6336055de2b \
            --warmups 2 --samples 6 --threads 2 \
            --out stage-general.json
      - name: Profile pinned record workloads
        run: |
          python benchmarks/profile_stages.py \
            --rust-bin target/release/gliner \
            --model-dir checkpoint \
            --checkpoint-sha256 4ee982787ace270d4bf15dbcb28ced38e0aa201372347114ceedd6336055de2b \
            --cases benchmarks/record_perf_cases.json \
            --warmups 2 --samples 6 --threads 2 --port 18932 \
            --out stage-records.json
      - name: Publish run-bound stage trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-inference-stage-evidence
          path: |
            stage-general.json
            stage-records.json
            stage-general.stages.log
            stage-records.stages.log
          if-no-files-found: warn
          retention-days: 7
