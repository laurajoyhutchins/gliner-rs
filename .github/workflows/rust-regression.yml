name: Rust inference regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'benchmarks/**'
      - '.github/workflows/rust-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Syntax-check benchmark entry points
        run: python3 -m py_compile benchmarks/compare.py benchmarks/compare_rust_revisions.py
      - name: Install JSON Schema validator for Docling contract boundary
        run: python3 -m pip install --user jsonschema==4.26.0
      - name: Regulatory corpus and reviewed-gold contract tests
        run: python3 -m unittest discover -s benchmarks/regulatory -p 'test_*.py' -v
      - name: Syntax-check real-document benchmarks
        run: python3 -m py_compile benchmarks/regulatory/*.py

      - name: Offline-independent library regression tests
        run: cargo test --locked --release --lib
      - name: Verify opt-in batch benchmark compiles
        run: cargo check --locked --example bench_bucketed
