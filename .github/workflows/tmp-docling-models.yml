name: Temporary integration source transport
on:
  push:
    branches: [agent/docling-structured-layout-verification]
    paths: ['.github/workflows/tmp-docling-models.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build exact-commit Rust inference CLI
        run: cargo build --release --locked --bin gliner
      - name: Package exact branch source for private VM verification
        run: |
          set -euo pipefail
          git rev-parse HEAD > source-commit.txt
          tar -czf regulatory-integration.tar.gz benchmarks/regulatory
          sha256sum regulatory-integration.tar.gz > regulatory-integration.sha256
          tar -czf gliner-exact-cli.tar.gz -C target/release gliner
          sha256sum gliner-exact-cli.tar.gz > gliner-exact-cli.sha256
          sha256sum target/release/gliner > gliner-binary.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: regulatory-integration-source
          path: |
            regulatory-integration.tar.gz
            regulatory-integration.sha256
            source-commit.txt
            gliner-exact-cli.tar.gz
            gliner-exact-cli.sha256
            gliner-binary.sha256
          if-no-files-found: error
          retention-days: 1
