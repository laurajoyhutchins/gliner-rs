# Trusted, narrowly scoped source-branch artifact regeneration.
# Never run with a write token against a pull_request from a fork.
name: Refresh pinned browser WebAssembly

on:
  push:
    branches:
      - 'automation/wasm-artifact-sync'
    paths:
      - 'src/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'website/scripts/wasm-artifacts.ts'
      - 'website/wasm-pack-version'
      - '.github/workflows/wasm-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'laurajoyhutchins/gliner-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-pack
        run: cargo install --locked wasm-pack --version "$(cat website/wasm-pack-version)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate binary and bindings from current Rust
        run: node --experimental-strip-types website/scripts/wasm-artifacts.ts --write
      - name: Commit only generated browser package
        run: |
          git add -- website/src/wasm-pkg/gliner_rs_bg.wasm website/src/wasm-pkg/gliner_rs.js website/src/wasm-pkg/gliner_rs.d.ts website/src/wasm-pkg/gliner_rs_bg.wasm.d.ts website/src/wasm-pkg/package.json
          if git diff --cached --quiet; then
            echo "WASM artifacts already match source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate browser WebAssembly from pinned Rust tools"
          git push origin HEAD:automation/wasm-artifact-sync
